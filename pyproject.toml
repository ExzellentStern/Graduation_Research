[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.0"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

# ============================================================
# Flower アプリ設定（※このテーブルは1回だけ定義する）
# ============================================================
[tool.flwr.app.config]
num-server-rounds = 5
fraction-evaluate = 0.2
local-epochs = 1
learning-rate = 0.001
batch-size = 25
aggregation-method = "fedavg"   # "fedavg" / "median" / "trimmed_mean" / "krum" / "bulyan"
# 防御側が想定する悪性クライアント数の上限 f。
# -1 は「未指定」を意味し、実際の malicious_ids の数がそのまま使われる。
# （0は「防御側は悪性クライアントがいないと想定する」という有効な設定のため、
#   デフォルト値として使うと「未指定」と区別できなくなる。そのため -1 を番兵値にする）
num-malicious-assumed = -1

# 追加：実験の再現性用シード（実験計画書 7.5 対応、data-splitに使用）
# malicious-seedとは独立。run_experiments.py（7.6）で条件ごとに複数回実験する際、
# このseedを変えることで「同一条件・異なるデータ分割」の繰り返し実験を行う。
seed = 42

# 追加：IID / non-IID
data-split = "non_iid"          # "non_iid" または "dirichlet" に変える
dirichlet-alpha = 0.6     # non_iid/dirichlet の時に効く（0.1で激偏り）

# 追加：攻撃設定（今の実装に合わせる）
attack-type = "none"        # "sign_flip" or "scale"
poison-rate = 0.2

# 追加：悪性クライアント生成（実験計画書 7.3 対応）
num-clients = 10          # クライアント総数（federationのnum-supernodesと一致させること）
malicious-ratio = 0.1      # 悪性クライアント割合（0.0 / 0.1 / 0.2 / 0.3）
malicious-seed = 42        # malicious-ratioから自動生成する際のseed
malicious-ids = ""         # 手動指定したい場合はここに "0,1" のように書く（空なら自動生成を使う）

# 追加：実験ごとの出力先分離（実験計画書 7.6 対応）
output-dir = "."          # run_experiments.py が実験条件ごとに別ディレクトリを渡す


#######################################################################
