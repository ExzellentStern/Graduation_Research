[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.0"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

# ============================================================
# Flower アプリ設定（※このテーブルは1回だけ定義する）
# ============================================================
[tool.flwr.app.config]
num-server-rounds = 50
fraction-evaluate = 0.2
local-epochs = 1
learning-rate = 0.001
batch-size = 32          # Fang et al. (2020) のデフォルト（Fashion-MNIST以外は32）に合わせた
# 毎ラウンド・毎条件のfixed_eval画像（grid.png + 誤分類画像）を保存するか。
# 大規模スイープではファイル数・ディスク容量を圧迫するためデフォルトはfalse。
# 個別に可視化を見たい場合のみtrueにする。
save-fixed-eval = false
aggregation-method = "fedavg"   # "fedavg" / "median" / "trimmed_mean" / "krum" / "bulyan"
# 防御側が想定する悪性クライアント数の上限 f。
# -1 は「未指定」を意味し、実際の malicious_ids の数がそのまま使われる。
# （0は「防御側は悪性クライアントがいないと想定する」という有効な設定のため、
#   デフォルト値として使うと「未指定」と区別できなくなる。そのため -1 を番兵値にする）
num-malicious-assumed = -1

# 追加：実験の繰り返し試行番号（実験計画書 7.5 対応、data-splitに使用）
# Fang et al. (2020) の"trial"（同一条件を複数回繰り返す単位）に対応させた名称。
# malicious-seedとは独立だが、run_experiments.pyは条件ごとに複数回実験する際、
# このtrialの値をmalicious-seedにもそのまま渡している（データ分割・悪性クライアント
# 選出の両方をtrialごとに変えるため）。
trial = 1

# 追加：IID / non-IID
data-split = "non_iid"          # "iid" / "non_iid"（Fang方式） / "dirichlet"（旧方式，参考用）
non-iid-p = 0.5            # non_iid（Fang方式）の時に効く：ラベルlを対応クライアント群へ割り当てる確率（Fangのデフォルトと同じp=0.5）
dirichlet-alpha = 0.6      # dirichlet（旧方式）の時のみ効く（0.1で激偏り）。比較用に残す。

# 追加：攻撃設定（今の実装に合わせる）
attack-type = "none"        # "sign_flip" or "scale"
poison-rate = 0.2

# 追加：悪性クライアント生成（実験計画書 7.3 対応）
num-clients = 100          # クライアント総数（federationのnum-supernodesと一致させること）
malicious-ratio = 0.1      # 悪性クライアント割合（0.0 / 0.1 / 0.2 / 0.3）
malicious-seed = 42        # malicious-ratioから自動生成する際のseed
malicious-ids = ""         # 手動指定したい場合はここに "0,1" のように書く（空なら自動生成を使う）

# 追加：実験ごとの出力先分離（実験計画書 7.6 対応）
output-dir = "."          # run_experiments.py が実験条件ごとに別ディレクトリを渡す


#######################################################################
